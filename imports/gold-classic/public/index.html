<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GOLD — Global Digital Precious Metals Infrastructure Platform" />
  <meta name="theme-color" content="#0a0a0f" />

  <title>GOLD — Global Digital Precious Metals Infrastructure</title>

  <!-- خطوط Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* CSS أساسي للتحميل */
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0f;
      color: #b0b0c8;
      font-family: 'Inter', system-ui, sans-serif;
    }

    [dir="rtl"] body {
      font-family: 'Noto Sans Arabic', 'Cairo', sans-serif;
    }

    #root {
      min-height: 100vh;
    }

    /* شاشة التحميل الأولية */
    .gold-loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }

    .gold-loading-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #c9a84c, #8c7120);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 2rem;
      color: #0a0a0f;
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.3);
      animation: pulse-gold 2s infinite;
    }

    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 20px rgba(201, 168, 76, 0.2); }
      50% { box-shadow: 0 0 40px rgba(201, 168, 76, 0.4); }
    }

    .gold-loading-text {
      font-size: 0.9rem;
      color: #8888a0;
      letter-spacing: 2px;
    }

    .gold-loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #2a2a38;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- شاشة التحميل الأولية -->
    <div class="gold-loading-screen">
      <div class="gold-loading-logo">G</div>
      <div class="gold-loading-text">GOLD PLATFORM</div>
      <div class="gold-loading-spinner"></div>
    </div>
  </div>
</body>
</html>
